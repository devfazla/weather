<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found — Weather by devFazla</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="color-scheme" content="light dark" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Nunito:wght@800&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 32px 20px;
        box-sizing: border-box;
        background: #eaf3f6;
        color: #0f2130;
        font: 400 16px/1.6 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main {
        max-width: 460px;
      }
      p.kicker {
        margin: 0;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #1593cc;
      }
      h1 {
        margin: 14px 0 0;
        font-family: Nunito, Inter, system-ui, sans-serif;
        font-size: clamp(30px, 7vw, 42px);
        font-weight: 800;
        line-height: 1.15;
        letter-spacing: -0.025em;
      }
      p.body {
        margin: 14px 0 0;
        font-size: 15px;
        color: #7b93a5;
      }
      a.button {
        display: inline-flex;
        align-items: center;
        margin-top: 28px;
        padding: 13px 22px;
        border-radius: 10px;
        background: #0f2130;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        text-decoration: none;
      }
      a.button:hover {
        background: #1593cc;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #0b161c;
          color: #eaf2f7;
        }
        p.body {
          color: #93a6b1;
        }
        a.button {
          background: #f6f9fc;
          color: #0f2130;
        }
        a.button:hover {
          background: #5fbdea;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">404</p>
      <h1>That page isn't here</h1>
      <p class="body">
        The forecast lives at one address, and it takes any city you search for.
      </p>
      <p><a class="button" href="/">Back to the forecast</a></p>
    </main>
  </body>
</html>
